# fly.toml app configuration file generated for skin-yolo-api on 2025-01-14

app = "skin-yolo-api"
primary_region = "sin"  # Singapore - gần VN nhất

[build]
  [build.args]
    PYTHON_VERSION = "3.11"

[env]
  PORT = "8080"
  MODEL_PATH = "/app/model/best.pt"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "model_data"
  destination = "/app/model"